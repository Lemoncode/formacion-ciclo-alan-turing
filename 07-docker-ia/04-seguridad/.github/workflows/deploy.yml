name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout

      - name: Deploy to production
        run: |
          curl -X POST https://api.miempresa.com/deploy \
            -H "Authorization: Bearer ghp_abc123realtoken456xyz789" \
            -d '{"env": "production", "app": "status-api"}'

      - name: Notify team
        run: |
          curl -X POST https://hooks.slack.com/services/T00ABC/B00DEF/realwebhookXYZ \
            -d '{"text": "Deploy completado en producción"}'
