services:
  db:
    image: postgres:16-alpine
    container_name: manga-db
    environment:
      POSTGRES_DB: mangadb
      POSTGRES_USER: manga_user
      POSTGRES_PASSWORD: manga_password
    ports:
      - "5432:5432"
    volumes:
      - manga-db-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: manga-backend
    environment:
      DATABASE_URL: Host=db;Port=5432;Database=mangadb;Username=manga_user;Password=manga_password
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8080:8080"

volumes:
  manga-db-data:
