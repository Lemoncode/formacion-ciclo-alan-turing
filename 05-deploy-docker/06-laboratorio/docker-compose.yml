services:
  db:
    image: postgres:16-alpine
    container_name: manga-db
    environment:
      POSTGRES_DB: mangadb
      POSTGRES_USER: manga_user
      POSTGRES_PASSWORD: manga_password
    ports:
      - "5432:5432"
    volumes:
      - manga-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manga_user -d mangadb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: manga-backend
    environment:
      DATABASE_URL: Host=db;Port=5432;Database=mangadb;Username=manga_user;Password=manga_password
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: manga-frontend
    environment:
      API_URL: http://backend:8080
      HOST: 0.0.0.0
      PORT: "4321"
    ports:
      - "4321:4321"
    depends_on:
      - backend

volumes:
  manga-db-data:
